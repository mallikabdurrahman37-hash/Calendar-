<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendar</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css"></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/><feGaussianBlur in="n" stdDeviation="2" result="b"/><feDisplacementMap in="SourceGraphic" in2="b" scale="14" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<header><img class="logo" src="icons/icon-192.png" alt="Calendar"><button id="menu" aria-label="Menu">☰</button><button id="ttl"></button><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button><button id="today">Today</button></header>
<div id="cd"></div><main id="main"></main>
<button id="fab" aria-label="New event">+</button>
<nav id="dock" aria-label="Quick controls">
<button data-p="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<button data-p="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
<button data-p="today" aria-label="Today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="9" ry="4"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(120 12 12)"/></svg></button>
<button data-p="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
<button data-p="fab" aria-label="New event"><svg viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg></button></nav>
<aside id="drawer"><div class="dh"><img src="icons/icon-192.png" alt=""><b>Calendar</b></div>
<button data-v="year">Year</button><button data-v="month">Month</button><button data-v="week">Week</button><button data-v="day">Day</button><button data-v="schedule">Schedule</button><hr><button id="set">⚙ Settings</button></aside><div id="scrim"></div>
<dialog id="dlg"></dialog><div id="toast"></div>
<script src="app.js"></script>
<script>document.querySelectorAll("#dock [data-p]").forEach(function(b){b.addEventListener("click",function(){document.getElementById(b.dataset.p).click()})})</script></body></html>
